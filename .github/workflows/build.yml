# Build the mod and run JUnit tests + GameTests on every pull request and every push to main.
# Feature branches are built once, by their pull request, not a second time by the push.
# Test results are published as a check ("Test results") with a summary on the run page.

name: build
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  checks: write        # publish the test report check

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: setup gradle (cache)
        uses: gradle/actions/setup-gradle@v6
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build (compile, JUnit, GameTests, jar)
        run: ./gradlew build -x downloadAssets # datagen does not need the game's assets (700 MB)
      - name: publish test report
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v6
        with:
          check_name: Test results
          report_paths: 'build/test-results/**/TEST-*.xml'
          detailed_summary: true
          include_passed: true
          require_tests: true
      - name: upload HTML test report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests/
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
