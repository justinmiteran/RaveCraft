plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'checkstyle'
	id 'pmd'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				name = "Shedaniel"
				url = "https://maven.shedaniel.me"
			}
		}
		filter {
			includeGroup "me.shedaniel.cloth"
		}
	}
}

def datagenOutput = file("src/main/generated")

fabricApi {
	configureDataGeneration {
		client = true
		addToResources = false // the generated source set below takes the output instead
	}
}

// The datagen output, src/main/generated (never committed). A source set of its own, outside main's resources: runDatagen
// needs main's resources, so it could not write into them without depending on itself.
sourceSets {
	generated {
		java.srcDirs = []
		resources {
			srcDirs = [datagenOutput]
			exclude ".cache/"
		}
	}
}

loom {
	splitEnvironmentSourceSets()
	accessWidenerPath = file("src/main/resources/ravecraft.classtweaker")

	mods {
		"ravecraft" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
			sourceSet sourceSets.generated
		}
	}
}

// GameTests live in their own source set and mod (src/gametest), never in the release jar.
// Declared after loom {}: the test source set builds on the split client/main source sets.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "ravecraft-gametest"
		enableGameTests = true
		enableClientGameTests = false
	}
}

// Write GameTest results as JUnit XML next to the JUnit ones, so CI can report both.
loom {
	runs {
		client {
			// ./gradlew runClient -PfolderDialog=builtin (or classic) tests the folder dialog fallbacks.
			if (project.hasProperty("folderDialog")) {
				property("ravecraft.folderDialog", project.property("folderDialog").toString())
			}
		}
		gameTest {
			property("fabric-api.gametest.report-file", file("build/test-results/gameTest/TEST-gametest.xml").absolutePath)
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Trinkets Updated 4.2.1+26.3: optional back slot, compile only (never in the jar, never in depends)
	compileOnly "maven.modrinth:XaT8sLP6:lVR1OKgV"

	// JEI 31.23.0.129+26.3 and Just Enough Resources 1.11.0.64+26.3: optional recipe viewer plugins, client compile
	// only (never in the jar, never in depends); drop the jars in run/mods to try them
	clientCompileOnly "maven.modrinth:u6dRKJwZ:W90vrxwW"
	clientCompileOnly "maven.modrinth:uEfK2CXF:UVP2aDOK"

	// Roughly Enough Items 26.3.824 and the maths classes of its API: optional recipe viewer plugins, compile only
	// (never in the jar, never in depends); REI has a server plugin, so it is on the common classpath too
	compileOnly "maven.modrinth:nfn13YXA:rKsAE6bX"
	clientCompileOnly "maven.modrinth:nfn13YXA:rKsAE6bX"
	clientCompileOnly "me.shedaniel.cloth:basic-math:0.6.1"

	// Audio decoders, bundled jar-in-jar (licences: LICENSE-THIRD-PARTY.md)
	include(implementation("javazoom:jlayer:1.0.1"))
	include(implementation("org.jflac:jflac-codec:1.5.2"))
	include(implementation("io.github.jaredmdobson:concentus:1.0.2"))

	// Native folder dialog (tinyfd), bundled jar-in-jar with its natives
	include(implementation("org.lwjgl:lwjgl-tinyfd:${project.lwjgl_version}"))
	['windows', 'windows-arm64', 'linux', 'linux-arm64', 'macos', 'macos-arm64'].each { os ->
		include(runtimeOnly("org.lwjgl:lwjgl-tinyfd:${project.lwjgl_version}:natives-${os}"))
	}

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
	// Test fixtures only: encodes the FLAC sample, never shipped
	testImplementation "net.sourceforge.javaflacencoder:java-flac-encoder:0.3.7"
}

test {
	useJUnitPlatform()
}

// Code rules (config/checkstyle, config/pmd). Kept out of ./gradlew build on purpose:
// run them with ./gradlew codeQuality; CI runs it as its own job (.github/workflows/quality.yml).
// Any violation fails the task. Reports: build/reports/{checkstyle,pmd}/.
checkstyle {
	toolVersion = project.checkstyle_version
	maxWarnings = 0
	sourceSets = []
}

pmd {
	toolVersion = project.pmd_version
	ruleSets = []
	ruleSetFiles = files("config/pmd/ruleset.xml")
	consoleOutput = true
	sourceSets = []
}

tasks.register("codeQuality") {
	group = "verification"
	description = "Runs Checkstyle and PMD on every source set."
	dependsOn tasks.withType(Checkstyle), tasks.withType(Pmd)
}

// Datagen runs before whatever needs its output (jar, runClient, runServer, runGameTest), and only when the code or
// the resources it reads have changed.
def datagenClasspath = files(
		sourceSets.main.output.classesDirs, processResources, sourceSets.client.output.classesDirs, processClientResources,
		configurations.clientRuntimeClasspath, configurations.runtimeClasspath)

tasks.named("runDatagen") {
	classpath = datagenClasspath
	inputs.files(datagenClasspath).withPropertyName("datagenClasspath").withNormalizer(ClasspathNormalizer)
	outputs.dir(datagenOutput).withPropertyName("datagenOutput")
	// Loom counts the run directory as an input: the logs left there would make the task run every time.
	def runDirectory = file("run/datagen")
	doLast {
		runDirectory.deleteDir()
	}
}

processGeneratedResources {
	dependsOn "runDatagen"
}

[sourceSets.main, sourceSets.client, sourceSets.gametest].each {
	it.runtimeClasspath += files(processGeneratedResources)
}

// IntelliJ builds only the classes task of the module it runs.
tasks.named("clientClasses") {
	dependsOn processGeneratedResources
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from(processGeneratedResources)
	from(["LICENSE", "COPYING", "LICENSE-ASSETS.md"]) {
		rename { "${it}_$projectName"}
	}
}

tasks.named("sourcesJar") {
	from(processGeneratedResources)
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
